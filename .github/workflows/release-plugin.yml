name: Package and release Otzaria plugin

on:
  push:
    branches:
      - main
    paths:
      - manifest.json

permissions:
  contents: write

jobs:
  release:
    name: Validate, package, and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect manifest version change
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          VERSION="$(jq -er '.version | strings | select(length > 0)' manifest.json)"
          PREVIOUS_VERSION=""

          if [[ -n "${BEFORE_SHA:-}" ]] &&
             [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "${BEFORE_SHA}:manifest.json" 2>/dev/null; then
            PREVIOUS_VERSION="$(git show "${BEFORE_SHA}:manifest.json" | jq -r '.version // empty')"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == "$PREVIOUS_VERSION" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "manifest.json changed, but version stayed at ${VERSION}; skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: ${PREVIOUS_VERSION:-<first version>} -> ${VERSION}"
          fi

      - name: Validate and build .otzplugin
        id: package
        if: steps.version.outputs.changed == 'true'
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: .
          build: 'true'
          publish: 'false'

      - name: Create SHA-256 checksum file
        if: steps.version.outputs.changed == 'true'
        shell: bash
        env:
          PLUGIN_FILE: ${{ steps.package.outputs.plugin-file }}
        run: |
          set -euo pipefail
          if [[ -z "$PLUGIN_FILE" || ! -f "$PLUGIN_FILE" || "$PLUGIN_FILE" != *.otzplugin ]]; then
            echo "::error::The validator did not produce a valid .otzplugin file."
            exit 1
          fi

          PLUGIN_DIR="$(dirname "$PLUGIN_FILE")"
          PLUGIN_NAME="$(basename "$PLUGIN_FILE")"
          (cd "$PLUGIN_DIR" && sha256sum "$PLUGIN_NAME" > "${PLUGIN_NAME}.sha256")

      - name: Create GitHub Release and upload plugin
        if: steps.version.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PLUGIN_FILE: ${{ steps.package.outputs.plugin-file }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release ${TAG} already exists. Increase manifest.json version before publishing again."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Git tag ${TAG} already exists. Choose a new manifest.json version."
            exit 1
          fi

          CHECKSUM_FILE="${PLUGIN_FILE}.sha256"
          if [[ ! -f "$CHECKSUM_FILE" ]]; then
            echo "::error::Checksum file was not created."
            exit 1
          fi

          gh release create "$TAG" \
            "$PLUGIN_FILE" \
            "$CHECKSUM_FILE" \
            --title "שני טורים ${VERSION}" \
            --target "$RELEASE_COMMIT" \
            --generate-notes
